<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lynis Findings Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">🛡️ Lynis Findings Dashboard</span>
      <span id="scan-meta" class="navbar-text text-light small"></span>
    </div>
  </nav>

  <div class="container-fluid py-4">

    <div id="alert-area"></div>

    <div class="card mb-3 shadow-sm" id="summary-card">
      <div class="card-body">
        <div class="row g-3 text-center" id="summary-badges">
          <div class="col-6 col-md-3">
            <div class="text-muted small">Hardening Index</div>
            <div class="fs-4 fw-bold" id="metric-hardening">–</div>
          </div>
          <div class="col-6 col-md-3">
            <div class="text-muted small">Tests Performed</div>
            <div class="fs-4 fw-bold" id="metric-tests">–</div>
          </div>
          <div class="col-6 col-md-3">
            <div class="text-muted small">Open Findings</div>
            <div class="fs-4 fw-bold" id="metric-open">–</div>
          </div>
          <div class="col-6 col-md-3">
            <div class="text-muted small">Exempted</div>
            <div class="fs-4 fw-bold" id="metric-exempted">–</div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap align-items-center gap-2 mb-3 sticky-toolbar p-2 rounded shadow-sm">
      <button class="btn btn-outline-secondary btn-sm" id="btn-refresh">⟳ Refresh</button>
      <div class="form-check ms-2">
        <input class="form-check-input" type="checkbox" id="chk-select-all">
        <label class="form-check-label" for="chk-select-all">Select all visible</label>
      </div>
      <input
        type="text"
        id="reason-input"
        class="form-control form-control-sm ms-auto"
        style="max-width: 360px;"
        placeholder="Reason for accepting risk (optional)">
      <button class="btn btn-warning btn-sm fw-semibold" id="btn-exempt" disabled>
        Exempt Selected (<span id="selected-count">0</span>)
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle table-sm bg-body">
        <thead class="table-dark">
          <tr>
            <th style="width: 2rem;"></th>
            <th>Test</th>
            <th>Category</th>
            <th>Finding</th>
            <th>Severity</th>
            <th>Impact</th>
            <th>Remediation</th>
            <th>Explanation</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="findings-body">
          <tr><td colspan="9" class="text-center text-muted py-4">Loading findings…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
